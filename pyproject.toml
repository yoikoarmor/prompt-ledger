[project]
name = "prompt-ledger"
version = "0.1.0"
description = "Local metadata-only prompt collection with Qwen semantic deduplication"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = ["fastapi>=0.115.12,<1", "uvicorn>=0.34.2,<1"]

[project.optional-dependencies]
model = ["sentence-transformers>=4.1,<6", "transformers>=4.51,<5", "torch>=2.7,<3", "huggingface-hub>=0.30,<1"]
cuda = ["sentence-transformers>=4.1,<6", "transformers>=4.51,<5", "torch>=2.7,<3", "huggingface-hub>=0.30,<1"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
prompt-ledger = "prompt_ledger.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_ledger"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "model" }, { index = "pytorch-cuda", extra = "cuda" }]

[tool.uv]
conflicts = [[{extra = "model"}, {extra = "cuda"}]]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
